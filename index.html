<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#f5f4ef" />
<title>Operation 75</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    /* Auth + onboarding palette (orange brand) */
    --bg: #0a0a0f;
    --bg-elev: #14141c;
    --bg-card: #1a1a24;
    --border: #26262f;
    --border-strong: #353541;
    --text: #f5f5f7;
    --text-dim: #9ca3af;
    --text-faint: #6b7280;
    --accent: #f97316;
    --accent-hover: #fb923c;
    --accent-glow: rgba(249, 115, 22, 0.2);
    --success: #10b981;
    --danger: #ef4444;
    --gradient: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
    --gradient-soft: linear-gradient(135deg, rgba(249, 115, 22, 0.15) 0%, rgba(234, 88, 12, 0.05) 100%);

    /* Chat light theme */
    --chat-bg: #ffffff;
    --chat-header-bg: #ffffff;
    --chat-border: #ebebeb;
    --chat-msg-in: #1a1a1a;
    --chat-meta: #bbb;
    --chat-input-bg: #f4f4f4;
    --chat-day-bg: #f0f0f0;
    --chat-day-text: #aaa;

    /* WhatsApp iOS dark palette */
    --wa-bg: #0b141a;
    --wa-chat-bg: #0b141a;
    --wa-header: #1f2c33;
    --wa-bubble-out: #005c4b;
    --wa-bubble-out-tail: #005c4b;
    --wa-bubble-in: #1f2c33;
    --wa-bubble-in-tail: #1f2c33;
    --wa-text: #e9edef;
    --wa-text-secondary: #8696a0;
    --wa-text-time: #a4b1b8;
    --wa-divider: #1f2c33;
    --wa-input-bg: #1f2c33;
    --wa-input-text: #e9edef;
    --wa-tab-bar: #1f2c33;
    --wa-tab-active: #00a884;
    --wa-tab-inactive: #8696a0;
    --wa-link: #53bdeb;
    --wa-tick-read: #53bdeb;
    --wa-tick-sent: #8696a0;
    --wa-day-divider-bg: #1d2c33;
    --wa-day-divider-text: #8696a0;
    --wa-system-font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }
  body {
    position: fixed;
    inset: 0;
    overscroll-behavior: none;
  }
  #app { height: 100dvh; width: 100vw; position: relative; }

  /* LOADING */
  .loader {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    z-index: 100;
  }
  .loader-spin {
    width: 32px; height: 32px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* AUTH (unchanged orange branding) */
  .auth-screen {
    height: 100dvh; width: 100vw;
    display: flex; flex-direction: column;
    padding: 32px 24px;
    background:
      radial-gradient(circle at 20% 0%, rgba(249, 115, 22, 0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 100%, rgba(234, 88, 12, 0.06) 0%, transparent 50%),
      var(--bg);
    overflow-y: auto;
  }
  .auth-hero { flex: 0 0 auto; padding: 48px 0 40px; text-align: center; }
  .auth-mark {
    display: inline-flex; align-items: center; gap: 8px;
    font-weight: 800; font-size: 14px; letter-spacing: 0.18em;
    color: var(--accent); margin-bottom: 32px;
  }
  .auth-mark::before, .auth-mark::after {
    content: ''; width: 24px; height: 1px;
    background: var(--accent); opacity: 0.5;
  }
  .auth-title {
    font-size: 44px; font-weight: 800; line-height: 1;
    letter-spacing: -0.03em; margin-bottom: 16px;
  }
  .auth-title .num {
    background: var(--gradient);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .auth-tagline {
    font-size: 15px; color: var(--text-dim);
    line-height: 1.5; max-width: 280px; margin: 0 auto;
  }
  .auth-form {
    flex: 1 0 auto; display: flex; flex-direction: column;
    gap: 14px; max-width: 380px; width: 100%;
    margin: 0 auto; padding-top: 8px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-size: 12px; font-weight: 600; color: var(--text-dim);
    letter-spacing: 0.04em; text-transform: uppercase; padding-left: 4px;
  }
  .field input {
    width: 100%; padding: 16px 18px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 14px; color: var(--text);
    font-size: 16px; font-family: inherit;
    transition: border-color 0.15s, background 0.15s;
  }
  .field input:focus {
    outline: none; border-color: var(--accent); background: #1f1f2b;
  }
  .field input::placeholder { color: var(--text-faint); }
  .btn-primary {
    width: 100%; padding: 18px;
    background: var(--gradient); border: none; border-radius: 14px;
    color: white; font-size: 16px; font-weight: 700; font-family: inherit;
    cursor: pointer; margin-top: 8px;
    transition: transform 0.1s, box-shadow 0.2s;
    box-shadow: 0 8px 24px -8px var(--accent-glow);
  }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .auth-toggle {
    text-align: center; margin-top: 24px;
    font-size: 14px; color: var(--text-dim);
  }
  .auth-toggle button {
    background: none; border: none; color: var(--accent);
    font-weight: 600; font-family: inherit; font-size: 14px;
    cursor: pointer; padding: 4px; margin-left: 4px;
  }
  .auth-error {
    padding: 12px 16px; background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 12px;
    color: #fca5a5; font-size: 14px; line-height: 1.4;
  }
  .auth-error:empty { display: none; }
  .auth-success {
    padding: 12px 16px; background: rgba(16, 185, 129, 0.1);
    border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 12px;
    color: #6ee7b7; font-size: 14px; line-height: 1.4;
  }
  .auth-success:empty { display: none; }
  .auth-foot {
    flex: 0 0 auto; text-align: center; padding-top: 32px;
    font-size: 12px; color: var(--text-faint); letter-spacing: 0.05em;
  }

  /* ONBOARDING (unchanged orange branding) */
  .onb {
    height: 100dvh; width: 100vw;
    display: flex; flex-direction: column;
    background:
      radial-gradient(circle at 20% 100%, rgba(249, 115, 22, 0.06) 0%, transparent 50%),
      var(--bg);
  }
  .onb-top { flex: 0 0 auto; padding: 20px 24px 8px; display: flex; flex-direction: column; gap: 14px; }
  .onb-nav { display: flex; align-items: center; justify-content: space-between; height: 28px; }
  .onb-back {
    background: none; border: none; padding: 4px 8px;
    color: var(--text-dim); font-size: 14px; font-weight: 500;
    font-family: inherit; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    transition: color 0.15s;
  }
  .onb-back:hover { color: var(--text); }
  .onb-back:disabled { opacity: 0; pointer-events: none; }
  .onb-step { font-size: 12px; font-weight: 600; color: var(--text-faint); letter-spacing: 0.08em; }
  .onb-step .current { color: var(--accent); }
  .onb-progress { height: 3px; background: var(--bg-card); border-radius: 2px; overflow: hidden; }
  .onb-progress-fill {
    height: 100%; background: var(--gradient); border-radius: 2px;
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .onb-stage { flex: 1; overflow: hidden; position: relative; }
  .onb-screen {
    position: absolute; inset: 0;
    padding: 32px 24px 24px;
    display: flex; flex-direction: column;
    overflow-y: auto;
    animation: slideIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .onb-q-label { font-size: 12px; font-weight: 700; letter-spacing: 0.15em; color: var(--accent); margin-bottom: 16px; }
  .onb-q-title { font-size: 28px; font-weight: 700; line-height: 1.2; letter-spacing: -0.02em; margin-bottom: 12px; }
  .onb-q-hint { font-size: 15px; color: var(--text-dim); line-height: 1.5; margin-bottom: 32px; }
  .onb-input-area { flex: 1; display: flex; flex-direction: column; gap: 12px; padding-bottom: 24px; }
  .onb-options { display: flex; flex-direction: column; gap: 10px; }
  .onb-option {
    width: 100%; padding: 18px 20px;
    background: var(--bg-card); border: 1.5px solid var(--border);
    border-radius: 14px; color: var(--text);
    font-size: 16px; font-weight: 500; font-family: inherit;
    cursor: pointer; text-align: left;
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: space-between;
  }
  .onb-option:hover { border-color: var(--border-strong); }
  .onb-option.selected { background: var(--gradient-soft); border-color: var(--accent); }
  .onb-option.selected::after { content: '✓'; color: var(--accent); font-weight: 700; font-size: 18px; }
  .onb-number-row { display: flex; gap: 12px; }
  .onb-number-row > div { flex: 1; }
  .onb-num-label {
    font-size: 12px; font-weight: 600; color: var(--text-dim);
    letter-spacing: 0.04em; text-transform: uppercase; padding-left: 4px;
    margin-bottom: 6px; display: block;
  }
  .onb-num-input {
    width: 100%; padding: 18px 20px;
    background: var(--bg-card); border: 1.5px solid var(--border);
    border-radius: 14px; color: var(--text);
    font-size: 22px; font-weight: 600; font-family: inherit;
    transition: border-color 0.15s;
  }
  .onb-num-input:focus { outline: none; border-color: var(--accent); }
  .onb-num-suffix { position: relative; }
  .onb-num-suffix::after {
    content: attr(data-suffix);
    position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
    color: var(--text-faint); font-size: 14px; font-weight: 500; pointer-events: none;
  }
  .onb-textarea {
    width: 100%; min-height: 140px; padding: 18px 20px;
    background: var(--bg-card); border: 1.5px solid var(--border);
    border-radius: 14px; color: var(--text);
    font-size: 16px; font-family: inherit; line-height: 1.5;
    resize: none; transition: border-color 0.15s;
  }
  .onb-textarea:focus { outline: none; border-color: var(--accent); }
  .onb-textarea::placeholder { color: var(--text-faint); line-height: 1.5; }
  .onb-bottom {
    flex: 0 0 auto; padding: 12px 24px 28px;
    background: linear-gradient(to bottom, transparent, var(--bg) 30%);
  }
  .onb-cta {
    width: 100%; padding: 18px;
    background: var(--gradient); border: none; border-radius: 14px;
    color: white; font-size: 16px; font-weight: 700; font-family: inherit;
    cursor: pointer; transition: transform 0.1s, opacity 0.15s;
    box-shadow: 0 8px 24px -8px var(--accent-glow);
  }
  .onb-cta:active { transform: scale(0.98); }
  .onb-cta:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  .onb-welcome {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  .onb-welcome-mark { font-size: 13px; font-weight: 800; letter-spacing: 0.2em; color: var(--accent); margin-bottom: 24px; }
  .onb-welcome-title { font-size: 36px; font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 16px; max-width: 320px; }
  .onb-welcome-text { font-size: 16px; color: var(--text-dim); line-height: 1.5; max-width: 320px; margin-bottom: 40px; }
  .onb-welcome-meta { font-size: 13px; color: var(--text-faint); letter-spacing: 0.05em; margin-top: 32px; }
  .onb-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .onb-chip {
    padding: 12px 18px;
    background: var(--bg-card); border: 1.5px solid var(--border);
    border-radius: 999px; color: var(--text);
    font-size: 14px; font-weight: 500; font-family: inherit;
    cursor: pointer; transition: all 0.15s;
  }
  .onb-chip:hover { border-color: var(--border-strong); }
  .onb-chip.selected { background: var(--accent); border-color: var(--accent); color: white; font-weight: 600; }
  .onb-finalize {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 24px; gap: 24px;
  }
  .onb-finalize-spin {
    width: 48px; height: 48px;
    border: 3px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  .onb-finalize-text { font-size: 18px; font-weight: 600; color: var(--text); max-width: 280px; line-height: 1.4; }
  .onb-finalize-sub {
    font-size: 14px; color: var(--text-dim); max-width: 280px;
    line-height: 1.5; min-height: 42px; transition: opacity 0.2s;
  }

  /* ============== WHATSAPP iOS UI ============== */
  .wa-app {
    height: 100dvh; width: 100vw;
    background: var(--chat-bg);
    display: flex; flex-direction: column;
    color: #1a1915;
    font-family: var(--wa-system-font);
    -webkit-font-smoothing: antialiased;
  }

  /* Top header (per-tab) */
  .wa-header {
    flex: 0 0 auto;
    background: var(--chat-header-bg);
    padding: calc(env(safe-area-inset-top) + 8px) 16px 10px;
    display: flex; align-items: center;
    border-bottom: 0.5px solid var(--chat-border);
    gap: 12px;
    min-height: 56px;
    width: 100%;
  }
  .wa-header-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: #e8650a; color: #fff;
    font-size: 14px; font-weight: 500;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .wa-header-back {
    background: none; border: none; padding: 4px;
    color: var(--wa-link); font-size: 17px; font-family: inherit;
    cursor: pointer; display: flex; align-items: center; gap: 2px;
  }
  .wa-header-back svg { width: 20px; height: 20px; }
  .wa-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #00a884 0%, #008c6f 100%);
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; color: white; font-size: 14px;
    flex-shrink: 0;
  }
  .wa-header-info { flex: 1; min-width: 0; cursor: pointer; }
  .wa-header-name {
    font-size: 15px; font-weight: 500; line-height: 1.2;
    color: #111;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .wa-header-status {
    font-size: 11px; color: #e8650a;
    line-height: 1.3; margin-top: 3px;
    display: flex; align-items: center; gap: 5px;
  }
  .wa-status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #e8650a;
  }
  .wa-header-icons { display: flex; gap: 8px; flex-shrink: 0; }
  .wa-header-icon {
    width: 36px; height: 36px;
    background: transparent; border: none;
    color: var(--wa-text); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    transition: background 0.15s;
  }
  .wa-header-icon:hover { background: rgba(255,255,255,0.05); }
  .wa-header-icon svg { width: 22px; height: 22px; }
  .wa-header-title-only {
    font-size: 28px; font-weight: 700; color: #1a1915;
    flex: 1;
    letter-spacing: -0.01em;
  }

 .wa-chat-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px 14px;
    display: flex; flex-direction: column; gap: 14px;
    background-color: var(--chat-bg);
    scroll-behavior: smooth;
    width: 100%;
    box-sizing: border-box;
  }

  .wa-day-divider {
    align-self: center;
    background: var(--chat-day-bg);
    color: var(--chat-day-text);
    font-size: 11px; font-weight: 500;
    padding: 3px 10px;
    border-radius: 20px;
    margin: 4px 0;
  }

  .wa-msg {
    display: block;
    width: 100%;
    box-sizing: border-box;
    animation: msgIn 0.18s cubic-bezier(0.4, 0, 0.2, 1);
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .wa-msg-out { text-align: right; padding-left: 20%; }
  .wa-msg-in { text-align: left; padding-right: 20%; }

  .wa-sender {
    font-size: 12px;
    font-weight: 500;
    color: #e8650a;
    margin-bottom: 3px;
  }

  .wa-content {
    word-wrap: break-word;
    overflow-wrap: break-word;
  }

  .wa-msg-in .wa-content { display: block; }
  .wa-msg-out .wa-content { display: inline-block; text-align: left; }

  .wa-msg-in .wa-text {
    color: var(--chat-msg-in);
    font-size: 15px;
    line-height: 1.55;
    white-space: pre-wrap;
    display: block;
  }

  .wa-msg-out .wa-text {
    background: #e8650a;
    color: #fff;
    font-size: 15px;
    line-height: 1.45;
    padding: 9px 14px;
    border-radius: 18px;
    display: inline-block;
    white-space: pre-wrap;
    text-align: left;
  }

  .wa-meta {
    color: var(--chat-meta);
    font-size: 11px;
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .wa-msg-out .wa-meta { justify-content: flex-end; }

  .wa-tick { display: inline-flex; color: #e8650a; opacity: 0.7; }
  .wa-tick svg { width: 12px; height: 9px; }
  .wa-tick.unread { opacity: 0.4; }

  .wa-typing {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .wa-typing-bubble {
    border-radius: 12px;
    padding: 12px 14px;
    display: inline-flex; gap: 4px; align-items: center;
  }
  .wa-typing-dot {
    width: 6px; height: 6px;
    background: #888;
    border-radius: 50%;
    animation: typing 1.2s infinite ease-in-out;
  }
  .wa-typing-dot:nth-child(2) { animation-delay: 0.15s; }
  .wa-typing-dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typing {
    0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-3px); }
  }

  /* Empty state */
  .wa-empty {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 40px 24px;
    gap: 14px;
  }
  .wa-empty-icon {
    width: 64px; height: 64px;
    border-radius: 18px;
    background: rgba(232,101,10,0.1);
    border: 1px solid rgba(232,101,10,0.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
  }
  .wa-empty-title { font-size: 18px; font-weight: 600; color: #1a1915; }
  .wa-empty-text { font-size: 14px; color: #888; line-height: 1.5; max-width: 280px; }
  .wa-empty-prompts {
    margin-top: 12px;
    display: flex; flex-direction: column; gap: 8px;
    width: 100%; max-width: 320px;
  }
  .wa-empty-prompt {
    padding: 12px 16px;
    background: #fff;
    border: 0.5px solid var(--chat-border);
    border-radius: 12px;
    color: #1a1915;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    text-align: left;
  }
  .wa-empty-prompt:active { background: var(--chat-input-bg); }

  /* Input bar */
  .wa-input-area {
    flex: 0 0 auto;
    padding: 6px 8px calc(8px + env(safe-area-inset-bottom));
    background: var(--chat-header-bg);
    border-top: 0.5px solid var(--chat-border);
    display: flex; align-items: flex-end; gap: 6px;
    width: 100%;
  }
  .wa-input-pill {
    flex: 1;
    background: var(--chat-input-bg);
    border-radius: 22px;
    padding: 6px 10px 6px 12px;
    display: flex; align-items: center; gap: 8px;
    min-height: 38px;
  }
  .wa-input-icon {
    background: transparent; border: none;
    color: #aaa;
    cursor: pointer;
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    padding: 0;
  }
  .wa-input-icon svg { width: 22px; height: 22px; }
  .wa-input {
    flex: 1;
    background: transparent;
    border: none;
    color: #1a1915;
    font-size: 16px;
    font-family: inherit;
    line-height: 1.3;
    padding: 6px 0;
    resize: none;
    max-height: 120px;
    min-height: 22px;
  }
  .wa-input:focus { outline: none; }

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// ============================================================

const SUPABASE_URL = 'https://zmznsvgdwmptqakrfxtc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inptem5zdmdkd21wdHFha3JmeHRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MjA3NDQsImV4cCI6MjA5MzA5Njc0NH0.Iq2-krvKn01P9dFcYrx7SoaAbUTA8-CqnwJiKe3mp0M';
const CHAT_FN = '/.netlify/functions/chat';
const PROMPT_FN = '/.netlify/functions/generate-prompt';

const INSIGHT_FN = '/.netlify/functions/generate-insight';

const REDEEM_FN = '/.netlify/functions/redeem-coupon';
const VAPID_PUBLIC_KEY = 'BBIDG2YH5U3s49MBgbfoGWRC1r-Myn1GOgQslcPANj3qWLvENxyjwflsPHWho5IxEcHO2gHypWgQUN10puZJLtU';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const state = {
  user: null,
  profile: null,
  authMode: 'signup',
  messages: [],
  sending: false,
  activeTab: 'chats', // chats | stats | plan | settings
  statsCache: {
    insight: null,
    insightDate: null,
    charts: {},
  },
};

const app = document.getElementById('app');

// ============================================================
// ROUTER
// ============================================================
async function route() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    state.user = null;
    state.profile = null;
    renderAuth();
    return;
  }
  state.user = session.user;
  const { data: profile } = await supabase
    .from('profiles').select('*').eq('id', session.user.id).single();
  state.profile = profile;
  if (!profile?.onboarded) {
    renderOnboarding();
    return;
  }
  // Access gate — check after onboarding so new users can complete setup
  const now = new Date();
  const expiry = profile.access_expires_at ? new Date(profile.access_expires_at) : null;
  if (!expiry || expiry <= now) {
    renderCouponScreen();
    return;
  }
  renderMainApp();
}

// ============================================================
// COUPON SCREEN
// ============================================================
function renderCouponScreen() {
  const isExpired = !!(state.profile?.access_expires_at);
  app.innerHTML = `
    <div class="auth-screen">
      <div class="auth-hero">
        <div class="auth-mark">OPERATION 75</div>
        <div class="auth-title">Operation <span class="num">75</span></div>
        <p class="auth-tagline">${isExpired ? 'Your access has expired. Enter a code from MD to continue.' : 'Enter your access code to get started.'}</p>
      </div>
      <div class="auth-form" style="max-width: 380px; width: 100%; margin: 0 auto; gap: 14px; display: flex; flex-direction: column;">
        <div class="field">
          <label for="coupon-input">Access code</label>
          <input
            type="text"
            id="coupon-input"
            placeholder="e.g. MD-K7X2"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
            style="text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600;"
            maxlength="7"
          />
        </div>
        <div class="auth-error" id="coupon-error"></div>
        <button class="btn-primary" id="coupon-submit" disabled>Activate</button>
        <div class="auth-toggle">
          Not you? <button type="button" id="coupon-logout">Log out</button>
        </div>
      </div>
      <div class="auth-foot">YOUR BODY · YOUR PLAN · YOUR COACH</div>
    </div>`;

  const input = document.getElementById('coupon-input');
  const btn = document.getElementById('coupon-submit');
  const errorEl = document.getElementById('coupon-error');

  input.addEventListener('input', () => {
    // Auto-insert hyphen after MD
    let val = input.value.toUpperCase().replace(/[^A-Z0-9-]/g, '');
    if (val.length >= 2 && !val.includes('-')) {
      val = val.slice(0, 2) + '-' + val.slice(2);
    }
    input.value = val;
    btn.disabled = val.length < 7;
    errorEl.textContent = '';
  });

  btn.onclick = async () => {
    const code = input.value.trim();
    errorEl.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Activating...';
    try {
      const res = await fetch(REDEEM_FN, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, userId: state.user.id }),
      });
      const data = await res.json();
      if (!res.ok) {
        errorEl.textContent = data.error || 'Invalid code. Try again.';
        btn.disabled = false;
        btn.textContent = 'Activate';
        return;
      }
      // Update local profile so route() sees the new expiry
      state.profile.access_expires_at = data.access_expires_at;
      await route();
    } catch (err) {
      errorEl.textContent = 'Something went wrong. Try again.';
      btn.disabled = false;
      btn.textContent = 'Activate';
    }
  };

  document.getElementById('coupon-logout').onclick = async () => {
    await supabase.auth.signOut();
    state.authMode = 'login';
    await route();
  };

  // Allow Enter key
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !btn.disabled) btn.click();
  });
}

// ============================================================
// AUTH
// ============================================================
function renderAuth() {
  const isSignup = state.authMode === 'signup';
  app.innerHTML = `
    <div class="auth-screen">
      <div class="auth-hero">
        <div class="auth-mark">OPERATION</div>
        <div class="auth-title">Operation <span class="num">75</span></div>
        <p class="auth-tagline">${isSignup ? 'Your personal coach. Built for the body you want back.' : 'Welcome back. Let\'s keep going.'}</p>
      </div>
      <form class="auth-form" id="auth-form" autocomplete="on">
        ${isSignup ? `
          <div class="field">
            <label for="name">Your name</label>
            <input type="text" id="name" name="name" placeholder="What should the coach call you?" required autocomplete="name" />
          </div>` : ''}
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="${isSignup ? 'At least 6 characters' : 'Your password'}" required minlength="6" autocomplete="${isSignup ? 'new-password' : 'current-password'}" />
        </div>
        <div class="auth-error" id="auth-error"></div>
        <div class="auth-success" id="auth-success"></div>
        <button type="submit" class="btn-primary" id="auth-submit">${isSignup ? 'Start Operation 75' : 'Log in'}</button>
        <div class="auth-toggle">
          ${isSignup ? 'Already have an account?' : 'New here?'}
          <button type="button" id="toggle-mode">${isSignup ? 'Log in' : 'Create account'}</button>
        </div>
      </form>
      <div class="auth-foot">YOUR BODY · YOUR PLAN · YOUR COACH</div>
    </div>`;
  document.getElementById('toggle-mode').onclick = () => {
    state.authMode = isSignup ? 'login' : 'signup';
    renderAuth();
  };
  document.getElementById('auth-form').onsubmit = handleAuthSubmit;
}

async function handleAuthSubmit(e) {
  e.preventDefault();
  const isSignup = state.authMode === 'signup';
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const name = isSignup ? document.getElementById('name').value.trim() : null;
  const errorEl = document.getElementById('auth-error');
  const successEl = document.getElementById('auth-success');
  const submitBtn = document.getElementById('auth-submit');
  errorEl.textContent = ''; successEl.textContent = '';
  submitBtn.disabled = true;
  submitBtn.textContent = isSignup ? 'Creating account...' : 'Logging in...';
  try {
    if (isSignup) {
      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) throw error;
      if (data.user) await supabase.from('profiles').update({ name }).eq('id', data.user.id);
      if (data.session) await route();
      else {
        successEl.textContent = 'Account created. Check your email to confirm, then log in.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Start Operation 75';
      }
    } else {
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) throw error;
      await route();
    }
  } catch (err) {
    errorEl.textContent = friendlyError(err.message);
    submitBtn.disabled = false;
    submitBtn.textContent = isSignup ? 'Start Operation 75' : 'Log in';
  }
}

function friendlyError(msg) {
  if (!msg) return 'Something went wrong. Try again.';
  if (msg.includes('already registered')) return 'An account with this email already exists. Try logging in.';
  if (msg.includes('Invalid login')) return 'Wrong email or password.';
  if (msg.includes('Password should be')) return 'Password must be at least 6 characters.';
  if (msg.includes('Email not confirmed')) return 'Please confirm your email first.';
  return msg;
}

const onbState = { step: 0, answers: {} };

function renderOnboarding() {
  app.innerHTML = `
    <div class="onb">
      <div class="onb-top">
        <div class="onb-nav">
          <button class="onb-back" id="onb-back">← Back</button>

      <div class="onb-stage" id="onb-stage"></div>

    </div>`;
  document.getElementById('onb-back').onclick = onbBack;
  renderOnbStep();
}

function renderOnbStep() {
  const q = ONBOARDING_QUESTIONS[onbState.step];
  const total = ONBOARDING_QUESTIONS.length;
  const progressPct = (onbState.step / (total - 1)) * 100;
  document.getElementById('onb-progress').style.width = `${progressPct}%`;
  document.getElementById('onb-step-text').innerHTML =
    onbState.step === 0 || q.kind === 'finalize' ? '' :
    `<span class="current">${onbState.step}</span>  /  ${total - 2}`;
  document.getElementById('onb-back').disabled = onbState.step === 0 || q.kind === 'finalize';
  const stage = document.getElementById('onb-stage');
  const bottom = document.getElementById('onb-bottom');

  if (q.kind === 'welcome') {
    stage.innerHTML = `<div class="onb-screen"><div class="onb-welcome">
      <div class="onb-welcome-mark">OPERATION 75</div>
      <h1 class="onb-welcome-title">${q.title}</h1>
      <p class="onb-welcome-text">${q.text}</p>
      <div class="onb-welcome-meta">11 QUESTIONS · ~4 MINUTES</div>
    </div></div>`;
    bottom.innerHTML = `<button class="onb-cta" id="onb-next">${q.cta}</button>`;
    document.getElementById('onb-next').onclick = onbNext;
    return;
  }
  if (q.kind === 'finalize') {
    stage.innerHTML = `<div class="onb-screen"><div class="onb-finalize">
      <div class="onb-finalize-spin"></div>
      <div class="onb-finalize-text" id="onb-final-text">Building your coach...</div>
      <div class="onb-finalize-sub" id="onb-final-sub">Reading your answers</div>
    </div></div>`;
    bottom.innerHTML = '';
    finalizeOnboarding();
    return;
  }
  if (q.kind === 'options') {
    const selected = onbState.answers[q.field];
    stage.innerHTML = `<div class="onb-screen">
      <div class="onb-q-label">${q.label}</div>
      <h1 class="onb-q-title">${q.title}</h1>
      <p class="onb-q-hint">${q.hint}</p>
      <div class="onb-input-area"><div class="onb-options" id="opts">
        ${q.options.map(opt => `<button class="onb-option ${selected === opt.value ? 'selected' : ''}" data-value="${opt.value}"><span>${opt.label}</span></button>`).join('')}
      </div></div></div>`;
    bottom.innerHTML = `<button class="onb-cta" id="onb-next" ${selected ? '' : 'disabled'}>Continue</button>`;
    document.querySelectorAll('#opts .onb-option').forEach(btn => {
      btn.onclick = () => {
        onbState.answers[q.field] = btn.dataset.value;
        document.querySelectorAll('#opts .onb-option').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        document.getElementById('onb-next').disabled = false;
        setTimeout(() => onbNext(), 250);
      };
    });
    document.getElementById('onb-next').onclick = onbNext;
    return;
  }
  if (q.kind === 'numbers') {
    stage.innerHTML = `<div class="onb-screen">
      <div class="onb-q-label">${q.label}</div>
      <h1 class="onb-q-title">${q.title}</h1>
      <p class="onb-q-hint">${q.hint}</p>
      <div class="onb-input-area"><div class="onb-number-row">
        ${q.fields.map(f => `
          <div>
            <label class="onb-num-label">${f.label}</label>
            <div class="onb-num-suffix" data-suffix="${f.suffix}">
              <input type="number" class="onb-num-input" id="num-${f.field}" inputmode="decimal" min="${f.min}" max="${f.max}" placeholder="${f.placeholder}" value="${onbState.answers[f.field] || ''}" />
            </div>
          </div>`).join('')}
      </div></div></div>`;
    bottom.innerHTML = `<button class="onb-cta" id="onb-next">Continue</button>`;
    const validateNumbers = () => {
      const allValid = q.fields.every(f => {
        const v = parseFloat(document.getElementById(`num-${f.field}`).value);
        return !isNaN(v) && v >= f.min && v <= f.max;
      });
      document.getElementById('onb-next').disabled = !allValid;
    };
    q.fields.forEach(f => {
      const input = document.getElementById(`num-${f.field}`);
      input.addEventListener('input', () => {
        const v = parseFloat(input.value);
        if (!isNaN(v)) onbState.answers[f.field] = v;
        validateNumbers();
      });
    });
    validateNumbers();
    setTimeout(() => document.getElementById(`num-${q.fields[0].field}`)?.focus(), 100);
    document.getElementById('onb-next').onclick = onbNext;
    return;
  }
  if (q.kind === 'text') {
    const current = onbState.answers[q.field] || '';
    stage.innerHTML = `<div class="onb-screen">
      <div class="onb-q-label">${q.label}</div>
      <h1 class="onb-q-title">${q.title}</h1>
      <p class="onb-q-hint">${q.hint}</p>
      <div class="onb-input-area">
        <textarea class="onb-textarea" id="txt-input" placeholder="${q.placeholder}">${current}</textarea>
      </div></div>`;
    bottom.innerHTML = `<button class="onb-cta" id="onb-next">Continue</button>`;
    const txt = document.getElementById('txt-input');
    const validate = () => {
      const v = txt.value.trim();
      onbState.answers[q.field] = v;
      document.getElementById('onb-next').disabled = v.length < (q.minLength || 1);
    };
    txt.addEventListener('input', validate);
    validate();
    setTimeout(() => txt.focus(), 100);
    document.getElementById('onb-next').onclick = onbNext;
    return;
  }
  if (q.kind === 'chips') {
    const selected = onbState.answers[q.field] || [];
    stage.innerHTML = `<div class="onb-screen">
      <div class="onb-q-label">${q.label}</div>
      <h1 class="onb-q-title">${q.title}</h1>
      <p class="onb-q-hint">${q.hint}</p>
      <div class="onb-input-area"><div class="onb-chips" id="chips">
        ${q.options.map(opt => `<button class="onb-chip ${selected.includes(opt) ? 'selected' : ''}" data-value="${opt}">${opt}</button>`).join('')}
      </div></div></div>`;
    bottom.innerHTML = `<button class="onb-cta" id="onb-next" ${selected.length >= (q.minSelected || 1) ? '' : 'disabled'}>Continue</button>`;
    document.querySelectorAll('#chips .onb-chip').forEach(btn => {
      btn.onclick = () => {
        const value = btn.dataset.value;
        const current = onbState.answers[q.field] || [];
        if (current.includes(value)) {
          onbState.answers[q.field] = current.filter(v => v !== value);
          btn.classList.remove('selected');
        } else {
          onbState.answers[q.field] = [...current, value];
          btn.classList.add('selected');
        }
        document.getElementById('onb-next').disabled = onbState.answers[q.field].length < (q.minSelected || 1);
      };
    });
    document.getElementById('onb-next').onclick = onbNext;
    return;
  }
}

function onbNext() {
  if (onbState.step < ONBOARDING_QUESTIONS.length - 1) {
    onbState.step++;
    renderOnbStep();
  }
}
function onbBack() {
  if (onbState.step > 0) {
    onbState.step--;
    renderOnbStep();
  }
}

function ageBandToInt(band) {
  const map = { under_25: 23, '25_34': 30, '35_44': 40, '45_54': 50, '55_plus': 60 };
  return map[band] || null;
}

function templateSystemPrompt(answers, name) {
  // Used as fallback only if AI generation fails.
  const equipment = (answers.equipment || []).join(', ');
  return `You are ${name}'s personal fitness coach inside Operation 75. Stay strictly within fitness and health. If asked anything outside that, redirect warmly back to the goal.

WHO ${name.toUpperCase()} IS:
${name}, ${answers.height_cm}cm, ${answers.starting_weight_kg}kg, target ${answers.target_weight_kg}kg. Works as: ${answers.occupation}. ${answers.diet_type} diet. Equipment: ${equipment}.

THEIR REALITY: "${answers.daily_schedule}"
STARTING FROM: "${answers.starting_point}"
WHAT TRIPS THEM UP: "${answers.main_obstacle}"
WHAT THEY WANT: "${answers.primary_goals}"

Tone: warm, direct, like a friend who is also a serious coach. Reference their schedule. Never lecture. When they miss, ask one question, why, then solve it. End every response with one specific target.

LANGUAGE RULES: No motivational filler. No "great work" or "crushing it". No em dashes. No bullet lists in chat. Short sentences, often fragments. Vary openings.

After every response, append [CHECKIN:{"workout_done":true,...}] on a new line. Only fields you actually know. App strips it before display.`;
}

async function finalizeOnboarding() {
  const subEl = document.getElementById('onb-final-sub');
  const textEl = document.getElementById('onb-final-text');
  const messages = ['Reading your answers', 'Building your coaching profile', 'Calibrating tone and approach', 'Almost ready'];
  let i = 0;
  const interval = setInterval(() => {
    i++;
    if (i < messages.length) {
      subEl.style.opacity = '0';
      setTimeout(() => { subEl.textContent = messages[i]; subEl.style.opacity = '1'; }, 200);
    }
  }, 700);

  try {
    const name = state.profile?.name || state.user.email.split('@')[0];

    // Run both generations in parallel to halve onboarding time
    const [promptResult, planResult] = await Promise.allSettled([
      fetch(PROMPT_FN, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, answers: onbState.answers }),
      }).then(r => r.json()),
      fetch(PLAN_FN, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ answers: onbState.answers }),
      }).then(r => r.json()),
    ]);

    let systemPrompt;
    if (promptResult.status === 'fulfilled' && promptResult.value?.systemPrompt?.length > 200) {
      systemPrompt = promptResult.value.systemPrompt;
    } else {
      console.warn('AI prompt generation failed, using template:', promptResult.reason || promptResult.value);
      systemPrompt = templateSystemPrompt(onbState.answers, name);
    }

    const workoutPlan = (planResult.status === 'fulfilled' && planResult.value?.plan)
      ? planResult.value.plan
      : null;
    if (!workoutPlan) console.warn('Plan generation failed, will use default:', planResult.reason || planResult.value);

    const updatePayload = {
      age: ageBandToInt(onbState.answers.age_band),
      sex: onbState.answers.sex,
      height_cm: onbState.answers.height_cm,
      starting_weight_kg: onbState.answers.starting_weight_kg,
      target_weight_kg: onbState.answers.target_weight_kg,
      occupation: onbState.answers.occupation,
      daily_schedule: onbState.answers.daily_schedule,
      equipment: (onbState.answers.equipment || []).join(', '),
      diet_type: onbState.answers.diet_type,
      current_fitness: onbState.answers.starting_point,
      primary_goals: onbState.answers.primary_goals,
      obstacles: onbState.answers.main_obstacle,
      onboarding_answers: onbState.answers, // raw JSON for future regeneration
      system_prompt: systemPrompt,
      workout_plan: workoutPlan,
      onboarded: true,
      updated_at: new Date().toISOString(),
    };

    const { error } = await supabase.from('profiles').update(updatePayload).eq('id', state.user.id);
    if (error) throw error;

    await new Promise(r => setTimeout(r, Math.max(0, 3000 - i * 700)));
    clearInterval(interval);
    textEl.textContent = 'Your coach is ready.';
    subEl.textContent = '';
    await new Promise(r => setTimeout(r, 800));
    await route();
  } catch (err) {
    clearInterval(interval);
    textEl.textContent = 'Something went wrong.';
    subEl.innerHTML = `<div style="color: #fca5a5; margin-top: 8px; font-size: 13px;">${err.message}</div>
      <button class="onb-cta" style="margin-top: 16px; max-width: 200px;" onclick="location.reload()">Try again</button>`;
  }
}

function getInitials(name) {
  if (!name) return 'C';
  const parts = name.trim().split(/\s+/);
  return (parts[0][0] + (parts[1]?.[0] || '')).toUpperCase();
}

function fmtTime(ts) {
  const d = new Date(ts);
  return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

function fmtDay(ts) {
  const d = new Date(ts);
  const today = new Date();
  const yesterday = new Date(); yesterday.setDate(today.getDate() - 1);
  if (d.toDateString() === today.toDateString()) return 'Today';
  if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
  const diffDays = Math.floor((today - d) / (1000 * 60 * 60 * 24));
  if (diffDays < 7) return d.toLocaleDateString([], { weekday: 'long' });
  return d.toLocaleDateString([], { day: 'numeric', month: 'long', year: 'numeric' });
}

function stripCheckin(text) {
  return text.replace(/\[CHECKIN:\s*\{[\s\S]*?\}\]/g, '').trim();
}

function extractCheckin(text) {
  const match = text.match(/\[CHECKIN:\s*(\{[\s\S]*?\})\]/);
  if (!match) return null;
  try {
    return JSON.parse(match[1]);
  } catch (e) {
    console.warn('Checkin JSON parse failed:', match[1]);
    return null;
  }
}

    weight_kg: checkin.weight_kg ?? null,
    energy_level: checkin.energy_level ?? null,
    pushups_done: checkin.pushups_done ?? null,
    notes: checkin.notes ?? null,
  };
  const { error } = await supabase.from('checkins').insert(payload);

    const day = fmtDay(m.created_at);
    if (day !== lastDay) {
      html += `<div class="wa-day-divider">${day.toUpperCase()}</div>`;
      lastDay = day;
    }
    const isUser = m.role === 'user';
    const content = isUser ? m.content : stripCheckin(m.content);
    if (!content) continue;
    if (isUser) {
      html += `
        <div class="wa-msg wa-msg-out">
          <div class="wa-content">
            <div class="wa-text">${escapeHtml(content)}</div>
            <div class="wa-meta">
              <span>${fmtTime(m.created_at)}</span>
              <span class="wa-tick"><svg viewBox="0 0 16 11" fill="currentColor" stroke="none"><path d="M11.071.653L4.752 6.91 2.929 5.105 2 6.026l2.752 2.726L12 1.574zM15.071.653L8.752 6.91 7 5.176l-.929.921L8.752 8.823 16 1.574z"/></svg></span>
            </div>
          </div>
        </div>`;
    } else {
      html += `
        <div class="wa-msg wa-msg-in">
          <div class="wa-content">
            <div class="wa-text">${escapeHtml(content)}</div>
            <div class="wa-meta">
              <span>${fmtTime(m.created_at)}</span>
            </div>
          </div>
        </div>`;
    }
  }
  body.innerHTML = html;
  scrollToBottom();
}

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function scrollToBottom() {
  const body = document.getElementById('wa-chat-body');
  if (body) body.scrollTop = body.scrollHeight;
}

function setupChatInput() {
  const input = document.getElementById('wa-chat-input');
  const sendBtn = document.getElementById('wa-send-btn');

  const autoResize = () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  };
  const updateSendBtn = () => {
    sendBtn.style.display = input.value.trim() ? 'flex' : 'none';
  };
  input.addEventListener('input', () => {
    autoResize();
    updateSendBtn();
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (input.value.trim()) sendMessage();
    }
  });
  sendBtn.onclick = () => {
    if (input.value.trim()) sendMessage();
  };
  updateSendBtn();
}

function appendMessageToView(msg) {
  const body = document.getElementById('wa-chat-body');
  if (!body) return;
  if (body.querySelector('.wa-empty')) body.innerHTML = '';

  const lastDivider = [...body.querySelectorAll('.wa-day-divider')].pop();
  const day = fmtDay(msg.created_at);
  if (!lastDivider || lastDivider.textContent !== day.toUpperCase()) {
    const div = document.createElement('div');
    div.className = 'wa-day-divider';
    div.textContent = day.toUpperCase();
    body.appendChild(div);
  }

  const isUser = msg.role === 'user';
  const content = isUser ? msg.content : stripCheckin(msg.content);
  if (!content) return;

  const wrap = document.createElement('div');
  if (isUser) {
    wrap.className = 'wa-msg wa-msg-out';
    wrap.innerHTML = `
      <div class="wa-content">
        <div class="wa-text">${escapeHtml(content)}</div>
        <div class="wa-meta">
          <span>${fmtTime(msg.created_at)}</span>
          <span class="wa-tick"><svg viewBox="0 0 16 11" fill="currentColor" stroke="none"><path d="M11.071.653L4.752 6.91 2.929 5.105 2 6.026l2.752 2.726L12 1.574zM15.071.653L8.752 6.91 7 5.176l-.929.921L8.752 8.823 16 1.574z"/></svg></span>
        </div>
      </div>`;
  } else {
    wrap.className = 'wa-msg wa-msg-in';
    wrap.innerHTML = `
      <div class="wa-content">
        <div class="wa-text">${escapeHtml(content)}</div>
        <div class="wa-meta">
          <span>${fmtTime(msg.created_at)}</span>
        </div>
      </div>`;
  }
  body.appendChild(wrap);
  scrollToBottom();
}

function showTypingIndicator() {
  const body = document.getElementById('wa-chat-body');
  if (!body) return;
  if (body.querySelector('.wa-empty')) body.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'wa-msg wa-msg-in wa-typing';
  wrap.id = 'typing-indicator';
  wrap.innerHTML = `
    <div class="wa-typing-bubble">
      <div class="wa-typing-dot"></div>
      <div class="wa-typing-dot"></div>
      <div class="wa-typing-dot"></div>
    </div>`;
  body.appendChild(wrap);
  scrollToBottom();
}

function hideTypingIndicator() {
  document.getElementById('typing-indicator')?.remove();
}

function showChatError(msg) {
  hideTypingIndicator();
  const body = document.getElementById('wa-chat-body');
  if (!body) return;
  const banner = document.createElement('div');
  banner.className = 'wa-error-banner';
  banner.textContent = msg;
  body.appendChild(banner);
  scrollToBottom();
  setTimeout(() => banner.remove(), 6000);
}

async function sendMessage() {
  if (state.sending) return;
  const input = document.getElementById('wa-chat-input');
  const content = input.value.trim();
  if (!content) return;

  state.sending = true;
  input.value = '';
  input.style.height = 'auto';
  input.dispatchEvent(new Event('input'));

  const userMsg = {
    user_id: state.user.id,
    role: 'user',
    content,
    created_at: new Date().toISOString(),
  };
  state.messages.push(userMsg);
  appendMessageToView(userMsg);

  supabase.from('messages').insert({
    user_id: state.user.id, role: 'user', content,
  }).then(({ error }) => {
    if (error) console.error('Persist user msg error:', error);
  });

  showTypingIndicator();

  try {
    const apiMessages = state.messages.slice(-30).map(m => ({
      role: m.role,
      content: m.role === 'assistant' ? stripCheckin(m.content) : m.content,
    }));

    const res = await fetch(CHAT_FN, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        systemPrompt: state.profile.system_prompt,
        messages: apiMessages,
        userId: state.user.id,
      }),
    });

    const data = await res.json();
    if (!res.ok) {
      if (data.error === 'access_expired') {
        state.profile.access_expires_at = null;
        await route();
        return;
      }
      throw new Error(data.error || 'Coach is unreachable');
    }

    const fullText = data.text || '';
    const checkin = extractCheckin(fullText);

    hideTypingIndicator();

    const coachMsg = {
      user_id: state.user.id,
      role: 'assistant',
      content: fullText,
      created_at: new Date().toISOString(),
    };
    state.messages.push(coachMsg);
    appendMessageToView(coachMsg);

    supabase.from('messages').insert({
      user_id: state.user.id, role: 'assistant', content: fullText,
    }).then(({ error }) => {
      if (error) console.error('Persist coach msg error:', error);
    });
    if (checkin) saveCheckin(checkin);

  } catch (err) {
    console.error('Send error:', err);
    showChatError(err.message || 'Could not reach the coach. Try again.');
  } finally {
    state.sending = false;
  }
}

async function sendInitialGreeting() {
  state.sending = true;
  showTypingIndicator();
  try {
    const res = await fetch(CHAT_FN, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        systemPrompt: state.profile.system_prompt,
        messages: [{
          role: 'user',
          content: 'I just finished onboarding. This is our first conversation. Greet me in 2 sentences max. Reference one specific thing from my profile. End with one short question. No em dashes. No bullet points. No motivational phrases. No CHECKIN tag.',        }],
        userId: state.user.id,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Greeting failed');
    hideTypingIndicator();
    const coachMsg = {
      user_id: state.user.id,
      role: 'assistant',
      content: data.text,
      created_at: new Date().toISOString(),
    };
    state.messages.push(coachMsg);
    document.getElementById('wa-chat-body').innerHTML = '';
    appendMessageToView(coachMsg);
    await supabase.from('messages').insert({
      user_id: state.user.id, role: 'assistant', content: data.text,
    }).then(({ error }) => {
      if (error) console.error('Persist greeting error:', error);
    });
  } catch (err) {
    hideTypingIndicator();
    console.error('Greeting error:', err);
    renderChatMessages();
  } finally {
    state.sending = false;
  }
}

// Parse "9pm" / "21:00" / "9:30pm" → decimal hours (e.g. 21.5)
function parseDinnerTime(str) {
  if (!str) return null;
  str = str.trim().toLowerCase();
  const ampm = str.match(/(\d+)(?::(\d+))?\s*(am|pm)/);
  if (ampm) {
    let h = parseInt(ampm[1]);
    const m = parseInt(ampm[2] || '0');
    if (ampm[3] === 'pm' && h !== 12) h += 12;
    if (ampm[3] === 'am' && h === 12) h = 0;
    return h + m / 60;
  }
  const h24 = str.match(/(\d+):(\d+)/);
  if (h24) return parseInt(h24[1]) + parseInt(h24[2]) / 60;
  const bare = str.match(/^(\d+)$/);
  if (bare) { const h = parseInt(bare[1]); return h < 12 ? h + 12 : h; }
  return null;
}

function fmtHour(decimal) {
  const h = Math.floor(decimal);
  const m = Math.round((decimal - h) * 60);
  const suffix = h >= 12 ? 'pm' : 'am';
  const disp = h > 12 ? h - 12 : (h === 0 ? 12 : h);
  return m > 0 ? `${disp}:${String(m).padStart(2,'0')}${suffix}` : `${disp}${suffix}`;
}

// Parse sessions_per_week from stored workout_plan JSON
function parseSessionsPerWeek(plan) {
  if (!plan) return 3;
  if (plan.sessions_per_week) return parseInt(plan.sessions_per_week);
  if (plan.frequency) {
    const m = plan.frequency.match(/(\d+)/);
    if (m) return parseInt(m[1]);
  }
  if (plan.days && Array.isArray(plan.days)) return plan.days.length;
  return 3;
}

// Which metric cards to show based on primary_goals
function shouldShow(metric, goals) {
  if (!goals || goals.length === 0) return true;
  const g = Array.isArray(goals) ? goals.join(' ') : String(goals);
  const gl = g.toLowerCase();
  const map = {
    weight:     () => true, // always show weight if they have a target
    compliance: () => true, // always show compliance
    dinner:     () => true, // always show dinner
    energy:     () => true, // always show energy
    pushups:    () => gl.includes('push') || gl.includes('strength') || gl.includes('power'),
    walks:      () => gl.includes('stamin') || gl.includes('walk') || gl.includes('cardio') || gl.includes('run'),
  };
  return map[metric] ? map[metric]() : true;
}

// Destroy any existing Chart.js instances to avoid canvas reuse errors
function destroyCharts() {
  for (const id of Object.keys(state.statsCache.charts)) {
    try { state.statsCache.charts[id].destroy(); } catch(e) {}
  }
  state.statsCache.charts = {};
}

function makeChart(id, config) {
  const canvas = document.getElementById(id);
  if (!canvas) return;
  const chart = new Chart(canvas, config);
  state.statsCache.charts[id] = chart;
}

async function renderStatsTab(container) {
  destroyCharts();

  const profile = state.profile || {};
  const goals = profile.primary_goals || [];
  const plan = profile.workout_plan;
  const sessionsPerWeek = parseSessionsPerWeek(plan);
  const targetWeight = profile.target_weight_kg;
  const startWeight = profile.starting_weight_kg;

  // Render shell immediately, populate async
  container.innerHTML = `
    <div class="wa-header">
      <div class="wa-header-title-only">Stats</div>
    </div>
    <div class="stats-scroll" id="stats-scroll">
      <div class="stats-insight" id="stats-insight">
        <div class="stats-insight-icon">💡</div>
        <div class="stats-insight-text stats-insight-loading" id="stats-insight-text">Analysing your check-ins…</div>
      </div>
      <div id="stats-body">
        <div style="text-align:center; padding: 40px; color:#bbb; font-size:13px;">Loading your data…</div>
      </div>
    </div>`;

  // Fetch last 30 days of checkins
  const since = new Date();
  since.setDate(since.getDate() - 30);
  const { data: checkins, error } = await supabase
    .from('checkins')
    .select('*')
    .eq('user_id', state.user.id)
    .gte('checkin_date', since.toISOString().slice(0, 10))
    .order('checkin_date', { ascending: true });

  if (error) {
    document.getElementById('stats-body').innerHTML =
      `<div style="text-align:center;padding:40px;color:#ef4444;font-size:13px;">Could not load check-ins: ${escapeHtml(error.message)}</div>`;
    document.getElementById('stats-insight-text').textContent = 'No data yet.';
    return;
  }

  renderStatsDashboard(checkins || [], goals, sessionsPerWeek, targetWeight, startWeight, plan);
  loadInsight(checkins || []);
}

function renderStatsDashboard(checkins, goals, sessionsPerWeek, targetWeight, startWeight, plan) {
  const body = document.getElementById('stats-body');
  if (!body) return;

  const hasData = checkins.length > 0;

  // ---- Compute metrics ----

  // Weight: last known, delta from start
  const weightPoints = checkins.filter(c => c.weight_kg).map(c => ({ date: c.checkin_date, v: c.weight_kg }));
  const lastWeight = weightPoints.length ? weightPoints[weightPoints.length - 1].v : null;
  const weightDelta = (lastWeight && startWeight) ? +(lastWeight - startWeight).toFixed(1) : null;

  // Workout compliance: last 4 weeks
  const fourWeeksAgo = new Date(); fourWeeksAgo.setDate(fourWeeksAgo.getDate() - 28);
  const recentCheckins = checkins.filter(c => new Date(c.checkin_date) >= fourWeeksAgo);
  const workoutDone = recentCheckins.filter(c => c.workout_done).length;
  const totalExpected = sessionsPerWeek * 4;
  const compliance = totalExpected > 0 ? Math.round((workoutDone / totalExpected) * 100) : null;

  // Dinner timing
  const dinnerData = checkins.filter(c => c.dinner_time).map(c => parseDinnerTime(c.dinner_time)).filter(v => v !== null);
  const avgDinner = dinnerData.length ? dinnerData.reduce((a, b) => a + b, 0) / dinnerData.length : null;
  // Trend: compare first half vs second half
  let dinnerTrend = null;
  if (dinnerData.length >= 4) {
    const half = Math.floor(dinnerData.length / 2);
    const early = dinnerData.slice(0, half).reduce((a, b) => a + b, 0) / half;
    const late = dinnerData.slice(half).reduce((a, b) => a + b, 0) / (dinnerData.length - half);
    dinnerTrend = late - early; // negative = getting earlier (good)
  }

  // Push-ups: last known, progression data
  const pushupPoints = checkins.filter(c => c.pushups_done).map(c => ({ date: c.checkin_date, v: c.pushups_done }));
  const lastPushups = pushupPoints.length ? pushupPoints[pushupPoints.length - 1].v : null;

  // Walk streak
  let walkStreak = 0;
  const sortedDesc = [...checkins].sort((a, b) => b.checkin_date.localeCompare(a.checkin_date));
  for (const c of sortedDesc) {
    if (c.walk_done === true) walkStreak++;
    else if (c.walk_done === false) break;
  }

  // Energy average
  const energyData = checkins.filter(c => c.energy_level).map(c => c.energy_level);
  const avgEnergy = energyData.length ? +(energyData.reduce((a, b) => a + b, 0) / energyData.length).toFixed(1) : null;

  // ---- Build HTML ----
  let html = '';

  // Row 1: Weight + Compliance
  html += `<div class="stats-section-label">Overview</div>`;
  html += `<div class="stats-cards-row">`;

  // Weight card
  if (shouldShow('weight', goals) && targetWeight) {
    if (lastWeight) {
      const toGo = +(lastWeight - targetWeight).toFixed(1);
      const deltaClass = weightDelta < 0 ? 'stats-card-trend-down' : weightDelta > 0 ? 'stats-card-trend-up' : '';
      const deltaSign = weightDelta > 0 ? '+' : '';
      html += `<div class="stats-card">
        <div class="stats-card-label">Weight</div>
        <div class="stats-card-value">${lastWeight}<span class="stats-card-unit">kg</span></div>
        <div class="stats-card-sub ${deltaClass}">${deltaSign}${weightDelta}kg since start</div>
        <div class="stats-card-sub">${toGo > 0 ? toGo + 'kg to go' : 'Target reached'}</div>
      </div>`;
    } else {
      html += `<div class="stats-card">
        <div class="stats-card-label">Weight</div>
        <div class="stats-card-value" style="font-size:18px">${startWeight}<span class="stats-card-unit">kg</span></div>
        <div class="stats-card-empty">No weigh-ins yet</div>
      </div>`;
    }
  }

  // Energy card
  if (shouldShow('energy', goals)) {
    if (avgEnergy) {
      html += `<div class="stats-card">
        <div class="stats-card-label">Energy avg</div>
        <div class="stats-card-value">${avgEnergy}<span class="stats-card-unit">/ 10</span></div>
        <div class="stats-card-sub">${energyData.length} check-ins</div>
      </div>`;
    } else {
      html += `<div class="stats-card">
        <div class="stats-card-label">Energy avg</div>
        <div class="stats-card-value" style="font-size:22px">—</div>
        <div class="stats-card-empty">No data yet</div>
      </div>`;
    }
  }

  html += `</div>`; // end row 1

  // Workout compliance bar
  if (shouldShow('compliance', goals)) {
    html += `<div class="stats-chart-card">
      <div class="stats-chart-title">Workout compliance · last 4 weeks</div>`;
    if (compliance !== null) {
      html += `<div class="stats-card-value" style="font-size:32px;margin-bottom:10px;">${compliance}<span class="stats-card-unit">%</span></div>
        <div class="stats-compliance-bar-wrap">
          <div class="stats-compliance-bar-bg">
            <div class="stats-compliance-bar-fill" style="width:${compliance}%"></div>
          </div>
          <div class="stats-compliance-label">${workoutDone} of ${totalExpected} sessions · ${sessionsPerWeek}x per week plan</div>
        </div>`;
    } else {
      html += `<div class="stats-chart-empty">No workout check-ins yet</div>`;
    }
    html += `</div>`;
  }

  // Row 2: Dinner + Walks
  html += `<div class="stats-cards-row">`;

  if (shouldShow('dinner', goals)) {
    if (avgDinner) {
      const trendLabel = dinnerTrend !== null
        ? (dinnerTrend < -0.1 ? '▲ Getting earlier' : dinnerTrend > 0.1 ? '▼ Getting later' : '→ Steady')
        : '';
      const trendClass = dinnerTrend !== null
        ? (dinnerTrend < -0.1 ? 'stats-card-trend-up' : dinnerTrend > 0.1 ? 'stats-card-trend-down' : '')
        : '';
      html += `<div class="stats-card">
        <div class="stats-card-label">Avg dinner</div>
        <div class="stats-card-value" style="font-size:22px">${fmtHour(avgDinner)}</div>
        <div class="stats-card-sub ${trendClass}">${trendLabel}</div>
      </div>`;
    } else {
      html += `<div class="stats-card">
        <div class="stats-card-label">Avg dinner</div>
        <div class="stats-card-value" style="font-size:22px">—</div>
        <div class="stats-card-empty">No data yet</div>
      </div>`;
    }
  }

  if (shouldShow('walks', goals)) {
    html += `<div class="stats-card">
      <div class="stats-card-label">Walk streak</div>
      <div class="stats-card-value">${walkStreak}<span class="stats-card-unit">days</span></div>
      <div class="stats-card-sub">${walkStreak === 0 ? 'No streak yet' : walkStreak === 1 ? 'Day 1 — keep going' : `${walkStreak} days in a row`}</div>
    </div>`;
  }

  html += `</div>`; // end row 2

  // Push-ups card (conditional on goal)
  if (shouldShow('pushups', goals)) {
    if (lastPushups) {
      html += `<div class="stats-card" style="margin-bottom:10px;">
        <div class="stats-card-label">Push-ups last reported</div>
        <div class="stats-card-value">${lastPushups}</div>
        <div class="stats-card-sub">${pushupPoints.length} reports logged</div>
      </div>`;
    } else {
      html += `<div class="stats-card" style="margin-bottom:10px;">
        <div class="stats-card-label">Push-ups</div>
        <div class="stats-card-value" style="font-size:22px">—</div>
        <div class="stats-card-empty">No data yet</div>
      </div>`;
    }
  }

  // Weight chart
  if (weightPoints.length >= 2) {
    html += `<div class="stats-chart-card">
      <div class="stats-chart-title">Weight trend · last 30 days</div>
      <div class="stats-chart-wrap"><canvas id="chart-weight"></canvas></div>
    </div>`;
  }

  // Push-up chart (conditional)
  if (shouldShow('pushups', goals) && pushupPoints.length >= 2) {
    html += `<div class="stats-chart-card">
      <div class="stats-chart-title">Push-up progression</div>
      <div class="stats-chart-wrap"><canvas id="chart-pushups"></canvas></div>
    </div>`;
  }

  if (!hasData) {
    html = `<div style="text-align:center;padding:48px 24px;">
      <div style="font-size:36px;margin-bottom:16px;">📊</div>
      <div style="font-size:17px;font-weight:600;color:#1a1915;margin-bottom:8px;">No check-ins yet</div>
      <div style="font-size:14px;color:#aaa;line-height:1.55;max-width:260px;margin:0 auto;">Chat with Bennet and your stats will appear here automatically after each session.</div>
    </div>`;
  }

  body.innerHTML = html;

  // Draw charts after DOM update
  if (weightPoints.length >= 2) {
    const labels = weightPoints.map(p => p.date.slice(5)); // MM-DD
    const data = weightPoints.map(p => p.v);
    const targetLine = targetWeight ? data.map(() => targetWeight) : null;
    makeChart('chart-weight', {
      type: 'line',
      data: {
        labels,
        datasets: [
          {
            label: 'Weight',
            data,
            borderColor: '#e8650a',
            backgroundColor: 'rgba(232,101,10,0.08)',
            borderWidth: 2,
            pointRadius: 3,
            pointBackgroundColor: '#e8650a',
            tension: 0.3,
            fill: true,
          },
          ...(targetLine ? [{
            label: 'Target',
            data: targetLine,
            borderColor: '#10b981',
            borderWidth: 1.5,
            borderDash: [4, 4],
            pointRadius: 0,
            fill: false,
          }] : []),
        ],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { font: { size: 10 }, color: '#aaa', maxRotation: 0 }, grid: { display: false } },
          y: { ticks: { font: { size: 10 }, color: '#aaa' }, grid: { color: '#f0f0f0' } },
        },
      },
    });
  }

  if (shouldShow('pushups', goals) && pushupPoints.length >= 2) {
    makeChart('chart-pushups', {
      type: 'line',
      data: {
        labels: pushupPoints.map(p => p.date.slice(5)),
        datasets: [{
          label: 'Push-ups',
          data: pushupPoints.map(p => p.v),
          borderColor: '#e8650a',
          backgroundColor: 'rgba(232,101,10,0.08)',
          borderWidth: 2,
          pointRadius: 3,
          pointBackgroundColor: '#e8650a',
          tension: 0.2,
          fill: true,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { font: { size: 10 }, color: '#aaa', maxRotation: 0 }, grid: { display: false } },
          y: { ticks: { font: { size: 10 }, color: '#aaa' }, grid: { color: '#f0f0f0' }, beginAtZero: true },
        },
      },
    });
  }
}

async function loadInsight(checkins) {
  const insightEl = document.getElementById('stats-insight-text');
  if (!insightEl) return;

  // Use cached insight if generated today
  const today = new Date().toISOString().slice(0, 10);
  if (state.statsCache.insight && state.statsCache.insightDate === today) {
    insightEl.textContent = state.statsCache.insight;
    insightEl.classList.remove('stats-insight-loading');
    return;
  }

  if (checkins.length < 3) {
    insightEl.textContent = checkins.length === 0
      ? 'Chat with Bennet and patterns will start appearing here.'
      : 'A few more check-ins and a pattern insight will appear here.';
    insightEl.classList.remove('stats-insight-loading');
    return;
  }

  try {
    const res = await fetch(INSIGHT_FN, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ checkins: checkins.slice(-30) }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Insight failed');
    const text = data.insight || 'No insight generated.';
    state.statsCache.insight = text;
    state.statsCache.insightDate = today;
    if (insightEl) {
      insightEl.textContent = text;
      insightEl.classList.remove('stats-insight-loading');
    }
  } catch (err) {
    console.warn('Insight error:', err.message);
    if (insightEl) {
      insightEl.textContent = 'Keep logging — patterns will appear here.';
      insightEl.classList.remove('stats-insight-loading');
    }
  }
}

  const daysHtml = plan.days.map(day => `

async function handleRegenerate() {
  const answers = state.profile.onboarding_answers;
  if (!answers) {
    showConfirm({
      title: 'Cannot regenerate',
      text: 'Your original onboarding answers were not saved. Use "Redo onboarding" to start fresh.',
      primaryLabel: 'OK',
      onPrimary: () => {},
    });
    return;
  }
  showConfirm({
    title: 'Regenerate coach?',
    text: 'This rebuilds your coach using your saved onboarding answers and the latest coaching style. Existing chat history stays.',
    primaryLabel: 'Regenerate',
    onPrimary: async () => {
      const name = state.profile?.name || state.user.email.split('@')[0];
      try {
        const res = await fetch(PROMPT_FN, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, answers }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Regeneration failed');
        await supabase.from('profiles').update({
          system_prompt: data.systemPrompt,
          updated_at: new Date().toISOString(),
        }).eq('id', state.user.id);
        await route();
      } catch (err) {
        showConfirm({
          title: 'Regeneration failed',
          text: err.message,
          primaryLabel: 'OK',
          onPrimary: () => {},
        });
      }
    },
    danger: false,
  });
}

function showConfirm({ title, text, primaryLabel, onPrimary, danger }) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-card">
      <div class="modal-card-title">${escapeHtml(title)}</div>
      <div class="modal-card-text">${escapeHtml(text)}</div>
      <div class="modal-card-actions">
        <button class="modal-card-btn" id="modal-cancel">Cancel</button>
        <button class="modal-card-btn ${danger ? 'danger' : 'primary'}" id="modal-primary">${escapeHtml(primaryLabel)}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  document.getElementById('modal-cancel').onclick = () => overlay.remove();
  document.getElementById('modal-primary').onclick = async () => {
    overlay.remove();
    await onPrimary();
  };
}

// ============================================================
// NOTIFICATIONS
// ============================================================
async function handleNotifToggle(e) {
  const enabled = e.target.checked;

  if (enabled) {
    // Check browser support
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
      e.target.checked = false;
      showConfirm({
        title: 'Not supported',
        text: 'Push notifications are not supported in this browser. On iPhone, add the app to your home screen first.',
        primaryLabel: 'OK',
        onPrimary: () => {},
      });
      return;
    }

    // Request permission
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      e.target.checked = false;
      showConfirm({
        title: 'Permission denied',
        text: 'Enable notifications in your browser settings, then try again.',
        primaryLabel: 'OK',
        onPrimary: () => {},
      });
      return;
    }

    try {
      // Register service worker
      const reg = await navigator.serviceWorker.register('/sw.js');
      await navigator.serviceWorker.ready;

      // Subscribe to push
      const subscription = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
      });

      // Save subscription to Supabase via function
      const res = await fetch(SAVE_SUB_FN, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          userId: state.user.id,
          subscription: subscription.toJSON(),
        }),
      });
      if (!res.ok) throw new Error('Failed to save subscription');

      // Update profile in Supabase
      await supabase.from('profiles')
        .update({ notifications_enabled: true })
        .eq('id', state.user.id);

      state.profile.notifications_enabled = true;

    } catch (err) {
      console.error('Notification setup error:', err);
      e.target.checked = false;
      showConfirm({
        title: 'Something went wrong',
        text: 'Could not enable notifications. Try again.',
        primaryLabel: 'OK',
        onPrimary: () => {},
      });
    }

  } else {
    // Turning off — just update the flag in Supabase
    await supabase.from('profiles')
      .update({ notifications_enabled: false })
      .eq('id', state.user.id);
    state.profile.notifications_enabled = false;
  }
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}
